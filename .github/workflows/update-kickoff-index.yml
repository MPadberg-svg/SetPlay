name: Update Kickoff Static Schedule Index

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: update-kickoff-index
  cancel-in-progress: false

jobs:
  build-kickoff-index:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax-check Kickoff index builder script
        run: python3 -m py_compile scripts/build_kickoff_index.py

      - name: Build static 8-day Kickoff schedule snapshot
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python3 scripts/build_kickoff_index.py

      - name: Commit and push updated Kickoff schedule index
        run: |
          if [ -z "$(git status --porcelain -- docs/kickoff/schedule_window.json)" ]; then
            echo "No changes to docs/kickoff/schedule_window.json; skipping commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/kickoff/schedule_window.json
          git commit -m "chore(kickoff): update 6-hourly static schedule snapshot"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
