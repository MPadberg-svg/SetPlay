name: Build and publish APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK for public download
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/SetPlay.apk

      - name: Validate APK and generate checksum
        run: |
          test -s app/build/outputs/apk/debug/SetPlay.apk
          file app/build/outputs/apk/debug/SetPlay.apk | grep -q 'Android package'
          (cd app/build/outputs/apk/debug && sha256sum SetPlay.apk > SetPlay.apk.sha256)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SetPlay
          path: |
            app/build/outputs/apk/debug/SetPlay.apk
            app/build/outputs/apk/debug/SetPlay.apk.sha256
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/debug/SetPlay.apk \
            app/build/outputs/apk/debug/SetPlay.apk.sha256 \
            --title "SetPlay $GITHUB_REF_NAME" \
            --generate-notes
