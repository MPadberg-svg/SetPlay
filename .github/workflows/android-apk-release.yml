name: Build & Release SetPlay APK

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    name: Build & Publish Installable SetPlay APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Keystore, Environment & Public Maven Build Config
        env:
          SPORT_API_KEY_SECRET: ${{ secrets.SPORT_API_KEY }}
        run: |
          # 1. Decode debug.keystore.base64 into debug.keystore
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi
          if [ -n "$SPORT_API_KEY_SECRET" ]; then
            echo "SPORT_API_KEY=$SPORT_API_KEY_SECRET" >> .env
          fi

          # 3. Accept Android SDK licenses on the GitHub ubuntu-latest runner
          if [ -n "$ANDROID_HOME" ] && [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

          # 4. Normalize AI Studio internal container versions to public Google Maven / Maven Central versions for CI
          cat << 'EOF' > gradle/libs.versions.toml
          [versions]
          agp = "8.7.3"
          coreKtx = "1.15.0"
          junit = "4.13.2"
          junitVersion = "1.2.1"
          espressoCore = "3.6.1"
          lifecycleRuntimeKtx = "2.8.7"
          lifecycleViewmodelCompose = "2.8.7"
          lifecycleRuntimeCompose = "2.8.7"
          activityCompose = "1.9.3"
          kotlin = "2.0.21"
          composeBom = "2024.09.00"
          googleDevtoolsKsp = "2.0.21-1.0.28"
          navigationCompose = "2.8.5"
          roomRuntime = "2.6.1"
          roomKtx = "2.6.1"
          roomCompiler = "2.6.1"
          kotlinxCoroutinesTest = "1.9.0"
          core = "1.6.1"
          runner = "1.6.2"
          coilCompose = "2.7.0"
          retrofit = "2.11.0"
          converterMoshi = "2.11.0"
          kotlinxCoroutinesAndroid = "1.9.0"
          kotlinxCoroutinesCore = "1.9.0"
          loggingInterceptor = "4.12.0"
          okhttp = "4.12.0"
          moshiKotlin = "1.15.1"
          moshiKotlinCodegen = "1.15.1"
          robolectric = "4.14.1"
          secretsGradlePlugin = "2.0.1"
          media3 = "1.5.1"

          [libraries]
          androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
          junit = { group = "junit", name = "junit", version.ref = "junit" }
          androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
          androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
          androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
          androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
          androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
          androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
          androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
          androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
          androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
          androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
          androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
          androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
          androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
          androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
          androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "roomRuntime" }
          androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "roomKtx" }
          androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "roomCompiler" }
          kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
          androidx-core = { group = "androidx.test", name = "core", version.ref = "core" }
          androidx-runner = { group = "androidx.test", name = "runner", version.ref = "runner" }
          androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
          androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
          androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
          coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coilCompose" }
          retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
          converter-moshi = { group = "com.squareup.retrofit2", name = "converter-moshi", version.ref = "converterMoshi" }
          kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesAndroid" }
          kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesCore" }
          logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "loggingInterceptor" }
          okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
          moshi-kotlin = { group = "com.squareup.moshi", name = "moshi-kotlin", version.ref = "moshiKotlin" }
          moshi-kotlin-codegen = { group = "com.squareup.moshi", name = "moshi-kotlin-codegen", version.ref = "moshiKotlinCodegen" }
          robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
          androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
          androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
          androidx-media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
          androidx-media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
          androidx-media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }

          [plugins]
          android-application = { id = "com.android.application", version.ref = "agp" }
          kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
          kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
          google-devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "googleDevtoolsKsp" }
          secrets = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version.ref = "secretsGradlePlugin" }
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
            alias(libs.plugins.android.application) apply false
            alias(libs.plugins.kotlin.android) apply false
            alias(libs.plugins.kotlin.compose) apply false
            alias(libs.plugins.google.devtools.ksp) apply false
            alias(libs.plugins.secrets) apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
            alias(libs.plugins.android.application)
            alias(libs.plugins.kotlin.android)
            alias(libs.plugins.kotlin.compose)
            alias(libs.plugins.google.devtools.ksp)
            alias(libs.plugins.secrets)
          }

          android {
            namespace = "com.example"
            compileSdk = 35

            defaultConfig {
              applicationId = "com.aistudio.streamvault.pvqtr"
              minSdk = 24
              targetSdk = 35
              versionCode = 1
              versionName = "1.0"
              testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
            }

            signingConfigs {
              create("debugConfig") {
                storeFile = file("${rootDir}/debug.keystore")
                storePassword = "android"
                keyAlias = "androiddebugkey"
                keyPassword = "android"
              }
            }

            buildTypes {
              debug {
                signingConfig = signingConfigs.getByName("debugConfig")
              }
            }

            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_11
              targetCompatibility = JavaVersion.VERSION_11
            }

            kotlinOptions {
              jvmTarget = "11"
            }

            buildFeatures {
              compose = true
              buildConfig = true
            }
          }

          secrets {
            propertiesFileName = ".env"
            defaultPropertiesFileName = ".env.example"
          }

          dependencies {
            implementation(platform(libs.androidx.compose.bom))
            implementation(libs.androidx.activity.compose)
            implementation(libs.androidx.compose.material.icons.core)
            implementation(libs.androidx.compose.material.icons.extended)
            implementation(libs.androidx.compose.material3)
            implementation(libs.androidx.compose.ui)
            implementation(libs.androidx.compose.ui.graphics)
            implementation(libs.androidx.compose.ui.tooling.preview)
            implementation(libs.androidx.core.ktx)
            implementation(libs.androidx.lifecycle.runtime.compose)
            implementation(libs.androidx.lifecycle.runtime.ktx)
            implementation(libs.androidx.lifecycle.viewmodel.compose)
            implementation(libs.androidx.navigation.compose)
            implementation(libs.androidx.room.ktx)
            implementation(libs.androidx.room.runtime)
            implementation(libs.coil.compose)
            implementation(libs.androidx.media3.exoplayer)
            implementation(libs.androidx.media3.ui)
            implementation(libs.androidx.media3.common)
            implementation(libs.androidx.media3.exoplayer.hls)
            implementation(libs.androidx.media3.datasource.okhttp)
            implementation(libs.converter.moshi)
            implementation(libs.kotlinx.coroutines.android)
            implementation(libs.kotlinx.coroutines.core)
            implementation(libs.logging.interceptor)
            implementation(libs.moshi.kotlin)
            implementation(libs.okhttp)
            implementation(libs.retrofit)
            "ksp"(libs.androidx.room.compiler)
            "ksp"(libs.moshi.kotlin.codegen)
          }
          EOF

          # Remove AI Studio container-specific in-process flag for standard CI runner
          sed -i '/kotlin.compiler.execution.strategy/d' gradle.properties
          sed -i '/org.gradle.configuration-cache/d' gradle.properties

      - name: Download Gradle 8.11.1 & Assemble APK
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.11.1/bin/gradle :app:assembleDebug --no-daemon --stacktrace

          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/SetPlay.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/SetPlay-latest.apk
          ls -lh release-apk/

      - name: Upload SetPlay APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SetPlay-APK
          path: release-apk/SetPlay.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish SetPlay.apk to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="latest"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi

          cat << 'EOF' > release-notes.md
          ## ⚽🎬 Set ▶ Play — Official Android APK (Latest Build)

          Download and install **`SetPlay.apk`** below on any Android phone, tablet, or Android TV box (**Android 7.0+ / API 24+**).

          ### 📥 Direct 1-Click Download Link
          - **[📲 Download `SetPlay.apk` (1-Click Install)](https://github.com/MPadberg-svg/SetPlay/releases/latest/download/SetPlay.apk)**

          ---

          ### ✨ What's Inside This Build
          - **⚽ KickOff Arena (MENA Live Hub)**: Real-time live scores & match minute auto-sync (`SportAPI.ai` + `TheSportsDB`), Sticky 3-Tier Matchday Broadcast Scrubber Deck, Featured Clash spotlight with Dual-Club Ambient Stadium Lighting & 5-Match Form Guide (`W • D • L`), and Dual-Stage Broadcast Launch Deck (`beIN Sports`, `AD Sports`, `SSC`, `Arryadia`) with animated 3-bar live equalizer.
          - **📋 Match Center Dossier 2.0**: 5-tab interactive match modal (Chronological Summary, 2D Tactical Pitch Lineups, Match Stats, H2H & Standings, and Official MENA TV Guide).
          - **📺 Broadcast Control Room Live TV**: Instant zap across 56,000+ live channels with `4K`/`FHD` quality tags, `ON AIR` EPG progress bar, and illuminated `(▶) WATCH` capsules.
          - **🎬 IMAX Glass Movies & Series Vaults**: Edge-lit poster cards, floating `★ Gold Rating` + `4K UHD` / `SERIES` micro-badges, and multi-season episode browser.
          EOF

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-apk/SetPlay.apk release-apk/SetPlay-latest.apk --clobber
            gh release edit "$TAG_NAME" --title "Set ▶ Play — Official Android APK (Latest Build)" --notes-file release-notes.md --latest
          else
            gh release create "$TAG_NAME" release-apk/SetPlay.apk release-apk/SetPlay-latest.apk \
              --title "Set ▶ Play — Official Android APK (Latest Build)" \
              --notes-file release-notes.md \
              --latest
          fi
