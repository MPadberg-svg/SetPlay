name: Build & Release SetPlay APK

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_target:
        description: "Which APK edition to build (both, phone, or tv)"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - phone
          - tv

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-release-apk:
    name: Build & Publish Installable SetPlay Dual APKs (Phone & TV)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Installable SetPlay Phone & TV APKs via Self-Bootstrapping Gradle Wrapper
        env:
          SPORT_API_KEY_SECRET: ${{ secrets.SPORT_API_KEY }}
          SPORTAPI_AI_KEY_SECRET: ${{ secrets.SPORTAPI_AI_KEY }}
          WYZIE_API_KEY_SECRET: ${{ secrets.WYZIE_API_KEY }}
          SUBDL_API_KEY_SECRET: ${{ secrets.SUBDL_API_KEY }}
          TMDB_API_KEY_SECRET: ${{ secrets.TMDB_API_KEY }}
          API_FOOTBALL_KEY_SECRET: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY_SECRET: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: |
          # Secrets Gradle Plugin 2.0.1 requires every key in .env to have a non-empty value;
          # an empty `KEY=` generates invalid Java (`public static final String KEY = ;`).
          # Fall back to non-empty `YOUR_*` placeholders whenever a GitHub Secret is not set.
          RESOLVED_SPORT_KEY="${SPORTAPI_AI_KEY_SECRET:-$SPORT_API_KEY_SECRET}"
          RESOLVED_SPORT_KEY="${RESOLVED_SPORT_KEY:-YOUR_SPORTAPI_AI_KEY}"
          RESOLVED_WYZIE_KEY="${WYZIE_API_KEY_SECRET:-YOUR_WYZIE_API_KEY}"
          RESOLVED_SUBDL_KEY="${SUBDL_API_KEY_SECRET:-YOUR_SUBDL_API_KEY}"
          RESOLVED_TMDB_KEY="${TMDB_API_KEY_SECRET:-YOUR_TMDB_API_KEY}"
          RESOLVED_FOOTBALL_KEY="${API_FOOTBALL_KEY_SECRET:-YOUR_API_FOOTBALL_KEY}"
          RESOLVED_FOOTBALL_DATA_KEY="${FOOTBALL_DATA_KEY_SECRET:-YOUR_FOOTBALL_DATA_KEY}"

          cat <<EOF > .env
          API_FOOTBALL_KEY=${RESOLVED_FOOTBALL_KEY}
          FOOTBALL_DATA_KEY=${RESOLVED_FOOTBALL_DATA_KEY}
          SPORT_API_KEY=${RESOLVED_SPORT_KEY}
          SPORTAPI_AI_KEY=${RESOLVED_SPORT_KEY}
          TMDB_API_KEY=${RESOLVED_TMDB_KEY}
          WYZIE_API_KEY=${RESOLVED_WYZIE_KEY}
          SUBDL_API_KEY=${RESOLVED_SUBDL_KEY}
          EOF
          sed -i 's/^[[:space:]]*//g' .env

          chmod +x ./gradlew
          TARGET_MODE="${{ github.event.inputs.build_target || 'both' }}"
          mkdir -p release-apk

          echo ">>> Running Unit & Robolectric Tests (:app:testDebugUnitTest)..."
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

          if [[ "$TARGET_MODE" == "both" || "$TARGET_MODE" == "phone" ]]; then
            echo ">>> Building SetPlay-Phone.apk (-PSETPLAY_TARGET=PHONE)..."
            ./gradlew :app:assembleDebug -PSETPLAY_TARGET=PHONE --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk release-apk/SetPlay-Phone.apk
            cp app/build/outputs/apk/debug/app-debug.apk release-apk/SetPlay.apk
          fi

          if [[ "$TARGET_MODE" == "both" || "$TARGET_MODE" == "tv" ]]; then
            echo ">>> Building SetPlay-TV.apk (-PSETPLAY_TARGET=TV)..."
            ./gradlew :app:assembleDebug -PSETPLAY_TARGET=TV --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk release-apk/SetPlay-TV.apk
          fi

          ls -lh release-apk/

      - name: Upload SetPlay-Phone-APK to GitHub Actions Artifacts
        if: ${{ (github.event.inputs.build_target || 'both') != 'tv' }}
        uses: actions/upload-artifact@v4
        with:
          name: SetPlay-Phone-APK
          path: release-apk/SetPlay-Phone.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload SetPlay-TV-APK to GitHub Actions Artifacts
        if: ${{ (github.event.inputs.build_target || 'both') != 'phone' }}
        uses: actions/upload-artifact@v4
        with:
          name: SetPlay-TV-APK
          path: release-apk/SetPlay-TV.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Dual Release Assets to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="latest"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi

          cat << 'EOF' > release-notes.md
          ## ⚽🎬 Set ▶ Play — Official Dual-Edition Android Phone & Android TV APKs (Latest Build)

          Choose the dedicated edition tailored for your device (**Android 7.0+ / API 24+**):

          ### 📥 Direct 1-Click APK Downloads

          | Edition | Target Devices | Direct 1-Click Download |
          | :--- | :--- | :---: |
          | 📱 **`SetPlay-Phone.apk`**<br>*(Touch & Companion Edition)* | **Android Phones, Tablets & Foldables**<br>Top/Bottom Glass Nav • Floating PiP • Wi-Fi TV Companion Remote | **[📲 Download `SetPlay-Phone.apk`](https://github.com/MPadberg-svg/SetPlay/releases/latest/download/SetPlay-Phone.apk)** |
          | 📺 **`SetPlay-TV.apk`**<br>*(10-Foot Living Room Edition)* | **Android TV, Google TV & Fire TV**<br>Left Glass Nav Rail • Live Channel Zapper Sidebar • Auto Wi-Fi Sync Host | **[📺 Download `SetPlay-TV.apk`](https://github.com/MPadberg-svg/SetPlay/releases/latest/download/SetPlay-TV.apk)** |

          ---

          ### ✨ What's Inside Both Editions
          - **⚽ KickOff Arena & Match Center 3.0**: Real-time live scores & match minute auto-sync (`API-Football`, `Football-Data.org`, `TheSportsDB`, `ESPN`), official TV broadcaster resolution (`Sofascore` + `TheSportsDB` + playlist match-channel scanner), and 5-tab interactive **Match Center Dossier** with **2D Tactical Pitch** & real player cutouts (`media.api-sports.io` + `TheSportsDB` + `Sofascore`).
          - **📺 Dedicated 10-Foot Android TV Experience (`SetPlay-TV.apk`)**: Widescreen Left Glass Navigation Rail (`216.dp`) with live Wi-Fi Sync PIN badge, In-Player **Live TV Channel Zapper Sidebar** (`D-Pad Left` or `📋 Channels` button), 2-Stage TV Back-Button Exit Guard, and D-Pad `AmberGold` focus choreography.
          - **📱⇄📺 Local Wi-Fi Phone ↔ TV QR Companion & Sync Mode**: Zero-cloud local Wi-Fi pairing via QR code or 6-digit PIN. Browse 289,000+ channels/movies on your phone and beam in 1 tap (`[ 📺 Send to TV ]` / `[ 📱 Watch Here ]`) with strict single-connection (`max_connections = 1`) protection and quick Live TV `- / +` channel zapping.
          - **🎬 Triple-Engine Subtitles & TMDB IMAX Dossier**: Automatic `imdb_id` / `tmdb_id` resolution (`TMDB API` + `IMDb Instant Suggestion`) powering parallel **Wyzie + SubDL (`.zip` -> `.srt`) + OpenSubtitles v3** subtitles (`🇸🇦 Arabic`, `🇬🇧 English`, `🇫🇷 Français`, `🇪🇸 Español`, `🇹🇷 Türkçe`) with remembered preferred language and 12-second auto-hide countdown.
          EOF

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-apk/*.apk --clobber
            gh release edit "$TAG_NAME" --title "Set ▶ Play — Official Phone & Android TV APKs (Latest Build)" --notes-file release-notes.md --latest
          else
            gh release create "$TAG_NAME" release-apk/*.apk \
              --title "Set ▶ Play — Official Phone & Android TV APKs (Latest Build)" \
              --notes-file release-notes.md \
              --latest
          fi
