name: Build & Release SetPlay APK

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    name: Build & Publish Installable SetPlay APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Package & Verify Installable Android APK
        run: |
          mkdir -p release-apk

          # 1. Use the verified AI Studio build output (.build-outputs/app-debug.apk) if present,
          #    or fall back to app/build/outputs/apk/debug/app-debug.apk
          if [ -f ".build-outputs/app-debug.apk" ]; then
            echo "Found verified APK in .build-outputs/app-debug.apk"
            cp .build-outputs/app-debug.apk release-apk/SetPlay.apk
            cp .build-outputs/app-debug.apk release-apk/SetPlay-latest.apk
          elif [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Found APK in app/build/outputs/apk/debug/app-debug.apk"
            cp app/build/outputs/apk/debug/app-debug.apk release-apk/SetPlay.apk
            cp app/build/outputs/apk/debug/app-debug.apk release-apk/SetPlay-latest.apk
          else
            echo "Error: APK binary not found in .build-outputs/app-debug.apk"
            exit 1
          fi

          # Verify APK integrity (ZIP/APK header check)
          unzip -t release-apk/SetPlay.apk > /dev/null
          ls -lh release-apk/

      - name: Upload SetPlay APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SetPlay-APK
          path: release-apk/SetPlay.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish SetPlay.apk to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="latest"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi

          cat << 'EOF' > release-notes.md
          ## ⚽🎬 Set ▶ Play — Official Android APK (Latest Build)

          Download and install **`SetPlay.apk`** below on any Android phone, tablet, or Android TV box (**Android 7.0+ / API 24+**).

          ### 📥 Direct 1-Click Download Links
          - **[📲 Download `SetPlay.apk` (from GitHub Release)](https://github.com/MPadberg-svg/SetPlay/releases/latest/download/SetPlay.apk)**
          - **[⚡ Direct Branch APK Download (`app-debug.apk`)](https://github.com/MPadberg-svg/SetPlay/raw/main/.build-outputs/app-debug.apk)**

          ---

          ### ✨ What's Inside This Build
          - **⚽ KickOff Arena (MENA Live Hub)**: Real-time live scores & match minute auto-sync (`SportAPI.ai` + `TheSportsDB`), Sticky 3-Tier Matchday Broadcast Scrubber Deck, Featured Clash spotlight with Dual-Club Ambient Stadium Lighting & 5-Match Form Guide (`W • D • L`), and Dual-Stage Broadcast Launch Deck (`beIN Sports`, `AD Sports`, `SSC`, `Arryadia`) with animated 3-bar live equalizer.
          - **📋 Match Center Dossier 2.0**: 5-tab interactive match modal (Chronological Summary, 2D Tactical Pitch Lineups, Match Stats, H2H & Standings, and Official MENA TV Guide).
          - **📺 Broadcast Control Room Live TV**: Instant zap across 56,000+ live channels with `4K`/`FHD` quality tags, `ON AIR` EPG progress bar, and illuminated `(▶) WATCH` capsules.
          - **🎬 IMAX Glass Movies & Series Vaults**: Edge-lit poster cards, floating `★ Gold Rating` + `4K UHD` / `SERIES` micro-badges, and multi-season episode browser.
          EOF

          # Create or update the release and upload SetPlay.apk + SetPlay-latest.apk
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-apk/SetPlay.apk release-apk/SetPlay-latest.apk --clobber
            gh release edit "$TAG_NAME" --title "Set ▶ Play — Official Android APK (Latest Build)" --notes-file release-notes.md --latest
          else
            gh release create "$TAG_NAME" release-apk/SetPlay.apk release-apk/SetPlay-latest.apk \
              --title "Set ▶ Play — Official Android APK (Latest Build)" \
              --notes-file release-notes.md \
              --latest
          fi
